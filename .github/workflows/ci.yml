name: CI

on:
  push:
    branches: [main]
  pull_request:

# Required repository secrets
# ---------------------------
# The web app reads its Sanity project from NEXT_PUBLIC_* variables at build
# time, and `next build` fails outright without them ("Configuration must
# contain `projectId`"), so both jobs below need these:
#
#   SANITY_PROJECT_ID   - Sanity project id (SANITY_PROJECT_ID)
#   SANITY_DATASET      - dataset to read, e.g. "staging" or "production"
#                         (SANITY_DATASET)
#
# Optional - the e2e run works without them, with reduced coverage:
#   MAPTILER_API_KEY    - NEXT_PUBLIC_MAPTILER_API_KEY; without it the map
#                         renders empty and school.spec's map assertion is the
#                         only thing affected.
#
# Deliberately NOT set here: BREVO_API_KEY and TURNSTILE_SECRET_KEY. The e2e
# suite stubs /api/contact, so CI must never hold credentials that could send
# real mail.
#
# The e2e job reads the real dataset through the dev server and is strictly
# read-only - no spec submits a form or writes content.

jobs:
  ci:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Sanity schema and the query result types are generated, committed,
      # and consumed by apps/web. Regenerating here and failing on a dirty tree
      # is what keeps them honest: a schema field renamed in the Studio without
      # a regenerate would otherwise typecheck against stale types and only
      # surface as a runtime `undefined`.
      #
      # Both commands are offline - `schema extract` reads the Studio's own
      # schema modules and `typegen generate` reads schema.json plus the
      # `defineQuery` call sites, so neither needs a project id or a dataset.
      - name: TypeGen is up to date
        run: |
          npm run typegen
          git diff --exit-code -- apps/studio/schema.json packages/types/src/sanity.generated.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: npm run build

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    # The unit layer is much faster; no point booting a browser if it is red.
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e specs
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          # next-intl routes by domain; these make localhost resolve to "cs".
          NEXT_PUBLIC_CZ_DOMAIN: localhost
          NEXT_PUBLIC_EN_DOMAIN: en.localhost
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
